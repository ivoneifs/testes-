<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#131d2f" />
  <title>NeuroScore — Acesso</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233157d5'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Segoe UI,Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ENS%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root{--primary:#2f57b8;--ink:#1b2333;--muted:#727d92;--line:#e5e9f0;--bg:#f4f6fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:"Inter","Segoe UI",system-ui,sans-serif;background:
      radial-gradient(1200px 600px at 50% -10%,#e9eefc,transparent),var(--bg);color:var(--ink)}
    .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);
      border-radius:18px;box-shadow:0 12px 40px rgba(17,24,39,.1);padding:30px 28px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
    .mark{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;font-weight:800;color:#fff;
      background:linear-gradient(150deg,#6f8cff,#3157d5 72%);box-shadow:0 10px 22px rgba(41,74,175,.4)}
    h1{font-size:19px;margin:0}.brand span{font-size:12px;color:var(--muted)}
    label{display:block;font-size:12px;font-weight:600;color:#54607a;margin:14px 0 6px}
    input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;
      background:#fafbfd;outline:none;transition:.15s}
    input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(47,87,184,.16)}
    button{width:100%;margin-top:20px;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;
      color:#fff;background:linear-gradient(180deg,#3a63c8,#2f57b8);cursor:pointer;transition:.15s}
    button:hover{filter:brightness(1.03)}button:disabled{opacity:.6;cursor:not-allowed}
    .switch{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
    .switch a{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none}
    .msg{margin-top:14px;font-size:12.5px;line-height:1.5;border-radius:10px;padding:10px 12px;display:none}
    .msg.err{display:block;background:#fdeceb;border:1px solid #f1c9c6;color:#a5322c}
    .msg.ok{display:block;background:#e4f3ec;border:1px solid #bfe3d2;color:#0f6f4b}
    .foot{margin-top:22px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">NS</div>
      <div><h1>NeuroScore</h1><span id="modeLabel">Entrar na sua conta</span></div>
    </div>

    <form id="form">
      <div id="nameRow" hidden>
        <label for="fullName">Nome completo</label>
        <input id="fullName" type="text" autocomplete="name" />
      </div>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required />
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required />
      <button id="submitBtn" type="submit">Entrar</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="switch" id="switch">
      Não tem conta? <a id="toggle">Criar conta</a>
    </div>

    <div class="foot">
      Ferramenta de apoio à correção e redação neuropsicológica.<br>
      Todo laudo exige revisão e assinatura de profissional habilitado.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.js"></script>
  <script>
  (async () => {
    const $ = (s) => document.querySelector(s);
    const msg = (t, ok) => { const m = $('#msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); };
    let cfg;
    try { cfg = await (await fetch('/api/config')).json(); } catch { cfg = {}; }

    if (!cfg.auth_enabled) { location.replace('/'); return; }
    const sb = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);

    const { data: { session } } = await sb.auth.getSession();
    if (session) { location.replace('/'); return; }

    let signup = false;
    $('#switch').addEventListener('click', (e) => {
      if (e.target.id !== 'toggle') return;
      signup = !signup;
      $('#nameRow').hidden = !signup;
      $('#fullName').required = signup;
      $('#password').autocomplete = signup ? 'new-password' : 'current-password';
      $('#modeLabel').textContent = signup ? 'Criar uma conta' : 'Entrar na sua conta';
      $('#submitBtn').textContent = signup ? 'Criar conta' : 'Entrar';
      $('#switch').innerHTML = signup
        ? 'Já tem conta? <a id="toggle">Entrar</a>'
        : 'Não tem conta? <a id="toggle">Criar conta</a>';
      $('#msg').className = 'msg';
    });

    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#email').value.trim();
      const password = $('#password').value;
      const btn = $('#submitBtn'); btn.disabled = true;
      try {
        if (signup) {
          const { error } = await sb.auth.signUp({
            email, password,
            options: { data: { full_name: $('#fullName').value.trim() } },
          });
          if (error) throw error;
          const { data: { session: s } } = await sb.auth.getSession();
          if (s) { location.replace('/'); return; }
          msg('Conta criada. Confirme o e-mail (se exigido) e faça login.', true);
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          location.replace('/');
        }
      } catch (err) {
        msg(err.message || 'Falha na autenticação.');
      } finally {
        btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
